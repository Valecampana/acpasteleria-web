<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="shortcut icon" href="../assets/imagen/portada1.jpg" type="image/x-icon">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
    integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

  <!-- Estilos propios -->
  <link rel="stylesheet" type="text/css" href="../css/estilo.css">

</head>
<body>

  <div class="container my-3">
    <!-- Encabezado y Navegación unificados -->
    <header class="row">
      <div class="col-12">
        <nav class="main__nav navbar navbar-expand-lg navbar-light rounded shadow-sm">
          
          <!-- Logo y título integrados a la izquierda -->
          <a class="navbar-brand d-flex align-items-center" href="../index.html">
            <img src="../assets/imagen/portada1.jpg" alt="portada" class="rounded mr-2" style="height: 40px; width: auto; object-fit: cover;">
          </a>

          <!-- Botón responsive para celulares -->
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Links de navegación alineados a la derecha -->
          <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="productos.html">Productos</a>
              </li>
              <li class="nav-item active">
                <a class="nav-link font-weight-bold" href="contacto.html">Contacto <span class="sr-only">(current)</span></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="ubicacion.html">Ubicación</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <!-- Contenido Principal: Formulario de Contacto y WhatsApp -->
    <main class="mt-4 col-lg-8 mx-auto bg-white p-4 rounded shadow-sm">
      <div class="text-center py-3 mb-3">
        <h1 class="font-weight-bold">CREAMOS PENSANDO EN VOS</h1>
        <p class="text-muted">¡Queremos escucharte! Dejanos tu consulta o encargo.</p>
      </div>

      <!-- Acceso directo a WhatsApp -->
      <div class="mb-4 text-center p-3 rounded" style="background-color: #f9f6f0; border: 1px dashed #6f4e37;">
        <p class="small mb-2 font-weight-bold">¿Preferís coordinar un pedido al instante?</p>
        <!-- Reemplazá los números X por tu número real de WhatsApp -->
        <a href="https://wa.me/5493571538797?text=Hola!%20Quería%20hacer%20un%20encargo%20o%20consulta%20en%20AC%20Pastelería" 
           target="_blank" rel="noopener noreferrer" 
           class="btn btn-whatsapp px-4 py-2 font-weight-bold shadow-sm d-inline-flex align-items-center justify-content-center">
          📲 ¡Hablemos por WhatsApp!
        </a>
      </div>

      <form action="" method="POST" id="form">
        
        <div class="form-group">
          <label for="nombre" class="font-weight-bold">Nombre</label>
          <input type="text" name="nombre" class="form-control form-control-marron" required>
        </div>

        <div class="form-group">
          <label for="email" class="font-weight-bold">Email</label>
          <input type="email" name="email" class="form-control form-control-marron" required>
        </div>

        <div class="form-group">
          <label for="motivo" class="font-weight-bold">Motivo de contacto</label>
          <input type="text" name="motivo" class="form-control form-control-marron" placeholder="Ej: Encargo de torta / Consulta de café" required>
        </div>

        <div class="form-group">
          <label for="mensaje" class="font-weight-bold">Mensaje</label>
          <textarea name="mensaje" class="form-control form-control-marron" rows="4" required></textarea>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn text-white px-5 py-2 font-weight-bold shadow-sm" style="background-color: #6f4e37; border-radius: 8px;">Enviar</button>
        </div>

      </form>
    </main>
  </div>

  <!-- Pie de página unificado -->
  <footer class="text-center py-4 mt-5 border-top">
    <div class="container">
      <ul class="list-inline mb-0 d-flex justify-content-center align-items-center">
        <li class="list-inline-item mr-4">
          <a href="contacto.html" class="font-weight-bold text-decoration-none">Contacto</a>
        </li>
        <li class="list-inline-item mr-3">
          <a href="https://www.instagram.com/ac.pasteleria_y_cafe/?hl=es" target="_blank" rel="noopener noreferrer">
            <img src="../assets/imagen/instagram.png" width="35" alt="Instagram">
          </a>
        </li>
      </ul>
    </div>
  </footer>

  <!-- Scripts de Bootstrap -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous">
  </script>
</body>
